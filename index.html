<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Adat Soft Solutions is a global tech agency building scalable, modern, and high-performance websites and mobile applications." />
    <title>Adat Soft Solutions</title>
    <style>
      #global-loader {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 999999; background: #F3F4F6;
        display: flex; align-items: center; justify-content: center;
        font-family: ui-sans-serif, system-ui, sans-serif;
        transition: transform 0.8s cubic-bezier(0.785, 0.135, 0.15, 0.86);
      }
      .gl-box {
        background: white; border-radius: 1rem; box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
        width: 320px; padding: 20px; display: flex; flex-direction: column; gap: 16px;
        transform: scale(0.9); opacity: 0;
        animation: gl-pop 0.5s ease-out forwards;
      }
      @keyframes gl-pop { to { transform: scale(1); opacity: 1; } }
      .gl-header { display: flex; justify-content: space-between; align-items: center; }
      .gl-title { font-size: 10px; font-weight: 900; letter-spacing: 0.1em; color: #737373; text-transform: uppercase; }
      .gl-dots { display: flex; gap: 6px; }
      .gl-dot { width: 8px; height: 8px; border-radius: 50%; background: #e5e5e5; }
      .gl-track { display: flex; justify-content: space-between; background: #f9fafb; padding: 6px; border-radius: 0.75rem; }
      .gl-block { width: 22px; height: 22px; border-radius: 6px; background: rgba(229,229,229,0.5); transition: background 0.2s; }
      .gl-block.filled { background: #525252; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); }
      .gl-footer { display: flex; justify-content: flex-end; }
      .gl-percent { font-size: 12px; font-weight: bold; color: #525252; }

      /* Floating Cards */
      .gl-card {
        display: none; position: absolute; background: white; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        opacity: 0;
      }
      .gl-bottom-left {
        bottom: 8rem; left: 8rem; width: 12rem; padding: 1rem;
        transform: translateY(20px) rotate(-15deg);
        animation: gl-pop-bl 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards;
      }
      @keyframes gl-pop-bl { to { transform: translateY(0) rotate(-12deg); opacity: 1; } }
      
      .gl-bottom-right {
        bottom: 8rem; right: 8rem; width: 16rem; padding: 1.25rem; border-radius: 0.75rem;
        transform: translateY(20px);
        animation: gl-pop-br 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.4s forwards;
      }
      @keyframes gl-pop-br { to { transform: translateY(0); opacity: 1; } }
      
      .gl-card-title { font-size: 12px; font-weight: bold; color: #a3a3a3; text-transform: uppercase; line-height: 1.25; margin: 0 0 1rem 0; }
      .gl-card-subtitle { font-size: 10px; font-weight: bold; color: #a3a3a3; text-transform: uppercase; line-height: 1.25; margin: 0; }
      .gl-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
      .gl-card-title-sm { font-size: 10px; font-weight: bold; color: #737373; text-transform: uppercase; margin: 0; }
      .gl-card-text { font-size: 10px; color: #a3a3a3; line-height: 1.625; margin: 0; }
      
      @media (min-width: 768px) {
        .gl-card { display: block; }
      }
    </style>
  </head>
  <body>
    <div id="global-loader">
      <div class="gl-card gl-bottom-left">
        <p class="gl-card-title">Adat Soft<br/>Solutions</p>
        <p class="gl-card-subtitle">Est.<br/>2017</p>
      </div>
      
      <div class="gl-card gl-bottom-right">
        <div class="gl-card-header">
          <p class="gl-card-title-sm">Our Mission</p>
          <div class="gl-dots"><div class="gl-dot"></div><div class="gl-dot"></div></div>
        </div>
        <p class="gl-card-text">We architect scalable, future-proof web and mobile apps. Focus on what matters - growing your business.</p>
      </div>

      <div class="gl-box">
        <div class="gl-header">
          <span class="gl-title">Loader</span>
          <div class="gl-dots"><div class="gl-dot"></div><div class="gl-dot"></div></div>
        </div>
        <div class="gl-track" id="gl-track">
          <div class="gl-block"></div><div class="gl-block"></div><div class="gl-block"></div>
          <div class="gl-block"></div><div class="gl-block"></div><div class="gl-block"></div>
          <div class="gl-block"></div><div class="gl-block"></div><div class="gl-block"></div>
          <div class="gl-block"></div>
        </div>
        <div class="gl-footer">
          <span class="gl-percent" id="gl-percent">0%</span>
        </div>
      </div>
    </div>
    <script>
      (function(){
        var progress = 0;
        var percentEl = document.getElementById('gl-percent');
        var blocks = document.getElementById('gl-track').children;
        var interval = setInterval(function() {
          progress += 5; // Fast forward: ~600ms total
          if(progress >= 100) {
            progress = 100;
            clearInterval(interval);
            window.__loaderFinished = true;
            if(window.__reactReady && window.__removeLoader) window.__removeLoader();
          }
          percentEl.innerText = Math.floor(progress) + '%';
          var filled = Math.floor(progress / 10);
          for(var i=0; i<10; i++) {
            if(i < filled) blocks[i].classList.add('filled');
          }
        }, 30);

        window.__removeLoader = function() {
          var loader = document.getElementById('global-loader');
          if(loader) {
            loader.style.transform = 'translateY(-100%)';
            setTimeout(function() { loader.remove(); }, 800);
          }
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
